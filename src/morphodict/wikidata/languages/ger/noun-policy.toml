schema_version = 2
reference = "Phase 3 first-gate German noun policy reviewed 2026-08-04"
sample_seed = "wikidata-20260729-german-noun-pilot-v1"
scale_seed = "wikidata-20260729-german-noun-scale-v1"
rank_policy = "preferred-over-normal; deprecated excluded"
review_status = "automatic"
singular_only_policy = "residual-api-gap"
combining_form_policy = "Q107614077 Forms are atomic evidence; P5548 remains construction-specific"
constructor_order = [
  "mkN_lemma",
  "mkN_lemma_gender",
  "invarN_one",
  "invarPlN_one",
  "invarN_two",
  "invarPlN_two",
  "mkN_two",
  "changeCompoundN",
  "mkN_three",
  "mkN_six",
  "pluralOnlyN",
  "abbrevN",
]

pinned_lexemes = ["L10227", "L295104", "L3146", "L40399"]

[acceptance_tiers]
automatic_complete_with_co = "complete required case-number evidence; exactly one effective gender; no blocker; one Q107614077 combining value or a listed reviewed productive rule"
automatic_complete = "complete required case-number evidence; exactly one effective gender; no blocker; every available source field must still be reproduced by GF"
review_required_provisional = "source-compatible proposal requiring missing inflectional, gender, or unlisted combining-form inference; GF probing remains mandatory"
excluded = "source conflict, unsupported feature, unresolved alternative, category mismatch, phrasal item, or residual API gap"

[compound_form_inference]
atomic_source_feature = "Q107614077"
construction_specific_property = "P5548"
reviewed_productive_rules = []
unlisted_derived_value = "provisional"
rationale = "No ParadigmsGer mkCompoundForm suffix/default rule is promoted at the first gate without an independently reviewed validation set."

[multi_gender]
sense_correlation_property = "P6072"
form_gender_features = ["Q499327", "Q1775415", "Q1775461"]
split_requirements = [
  "every effective gender claim has an owned sense correlation",
  "correlated sense sets are nonempty and pairwise disjoint",
  "forms are either a single nonconflicting shared paradigm or complete gender-correlated paradigms",
  "no unrelated alternatives are multiplied",
]
uncorrelated_policy = "reject-unresolved"

[quotas]
regular_masculine = 30
regular_feminine = 30
regular_neuter = 30
invariant = 20
invariant_plural = 20
plural_only = 20
singular_only = 20
abbreviation = 20
hyphenated = 20
explicit_combining = 20
ambiguous_combining = 10
irregular_full = 25
partial_evidence = 20
multiple_gender = 20
conflicting_slots = 20
rejected_feature = 10
restriction_conflict = 5
multiword = 10
